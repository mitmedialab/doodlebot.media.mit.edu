# The server's third-party dependencies. release/ is not an importable
# distribution of its own (the Dockerfile copies it in as the `server` package),
# so this installs dependencies only:
#
#   pip install ./release        # Docker / consumers
#   pip install -e ./release     # local dev (see the root requirements.txt)
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "doodlebot-ai-live-server"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.5.20",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
