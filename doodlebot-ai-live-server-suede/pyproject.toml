    "email-validator==2.3.0",
    "fastapi==0.136.3",
    "fastapi-cli==0.0.24",
    "fastapi-cloud-cli==0.20.0",
    "fastar==0.11.0",
    "google-auth==2.53.0",
    "google-genai==2.8.0",
