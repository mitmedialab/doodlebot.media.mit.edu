services:
  frontend:
    container_name: doodlebot-frontend
    volumes:
      - ./.frontend:/dist
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile # NOTE: path is relative to above context
    restart: "no"

  playground:
    container_name: doodlebot-playground
    volumes:
      - ./.playground:/dist
    build:
      dockerfile: ./playground.Dockerfile
    restart: "no"

  backend:
    container_name: doodlebot-backend
    build:
      context: ..
      dockerfile: ./docker/backend.Dockerfile
    volumes:
      - "./.frontend:/app/frontend"
      - "./.playground:/app/frontend/playground"
    env_file:
      - path: ../.env
        required: false
    networks:
      - app-network

  live:
    extends:
      file: ../doodlebot-ai-live-server-suede/compose.yml
      service: server
    # Don't expose on the host — Caddy reaches it over app-network on :5000.
    ports: !reset []
    # The base compose declares empty env defaults (e.g. OPENAI_API_KEY:
    # ${OPENAI_API_KEY:-}). Compose's `environment` overrides `env_file`, so
    # those empty strings would wipe the .env values. `!override` replaces the
    # inherited map so secrets load cleanly from .env (matching `backend`).
    # STATIC_HOST stays here because config.py's code default omits the
    # /doodlebot-ai-live path suffix.
    environment: !override
      STATIC_HOST: ${STATIC_HOST:-https://mitmedialab.github.io/doodlebot-ai-live}
    env_file:
      - path: ../.env
        required: false
    networks:
      - app-network

  caddy:
    container_name: doodlebot-caddy
    image: caddy:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
